    <script>
        function changeQty(index, delta) {
            const input = document.getElementById(`qty-${index}`);
            input.value = Math.max(0, (parseInt(input.value) || 0) + delta);
            calculate();
        }
        function calculate() {
            let totalKRW = 0;
            let mdTotal = 0;
            let drinkQty = 0;
            let dessertQty = 0;

            products.forEach((p, i) => {
                const qty = parseInt(document.getElementById(`qty-${i}`).value) || 0;
                totalKRW += qty * p.price;
                if (p.category === "Theme MD") mdTotal += qty * p.price;
                if (p.category === "Cafe Drink") drinkQty += qty;
                if (p.category === "Cafe Dessert") dessertQty += qty;
            });

            // 更新金額
            document.getElementById('krw-total').textContent = totalKRW.toLocaleString();
            document.getElementById('twd-total').textContent = Math.round(totalKRW * 0.024).toLocaleString();
            document.getElementById('md-only-total').textContent = mdTotal.toLocaleString();

            // MD 特典邏輯 (修正為階梯式：5萬/1張，10萬/2張上限)
            const mdCards = Math.floor(mdTotal / 50000);

            const remain = 50000 - (mdTotal % 50000);

            const progress = ((mdTotal % 50000) / 50000) * 100;

            let status = "";

            if (mdTotal < 50000) {

                status =
                    "再 ₩" +
                    remain.toLocaleString() +
                    " 送第 1 張";

            } else {

                status =
                    `已獲得 ${mdCards} 張 · 再 ₩${remain.toLocaleString()} 送第 ${mdCards + 1} 張`;
            }

            document.getElementById('md-bonus-count').textContent = mdCards;

            document.getElementById('md-progress').style.width = progress + "%";

            document.getElementById('md-status').textContent = status;

            // 咖啡廳特典
            document.getElementById('drink-bonus').textContent = drinkQty;
            document.getElementById('dessert-bonus').textContent = dessertQty;

            // 限制警告
            const warn = document.getElementById('limit-warning');
            let msg = [];
            if (drinkQty > 2) msg.push("飲品超標(限2)");
            if (dessertQty > 1) msg.push("甜點超標(限1)");
            
            if (msg.length > 0) {
                warn.textContent = "⚠️ 注意：" + msg.join("、") + "，以上為多人累計計算。";
                warn.classList.remove('hidden');
            } else {
                warn.classList.add('hidden');
            }
        }

            document.getElementById('image-modal').classList.remove('hidden');

        }

            document.getElementById('image-modal').classList.add('hidden');
            document.getElementById('image-modal').classList.remove('flex');
        }
        function closeListModal() {
            document.getElementById('list-modal').classList.add('hidden');
            document.getElementById('list-modal').classList.remove('flex');
        }

            let total = 0;

            products.forEach((p, i) => {

                if (qty > 0) {

                                    ">
                            </td>

                                    margin-top:4px;
                                    line-height:1.4;
                                ">

                            ">
                                ${qty}
                            </td>

                                text-align:right;
                                font-weight:700;
                                color:#b45309;
                            ">
                                ₩${subtotal.toLocaleString()}
                            </td>
